<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Man in the Mountain</title>
<link rel="stylesheet" href="mim_fonts.css">
<link rel="stylesheet" href="mim_film.css">

<div class="fit">
  <div class="phone" id="ph">
    <div class="slide">
      <img class="bed" id="bed" alt="">
      <div class="weave outer">
        <div class="vig"></div>
      </div>

      <div class="head" id="head" style="display:none">
        <button class="hbtn" id="bDict" disabled>인물사전</button>
        <button class="hbtn" id="bRel" disabled>관계도</button>
      </div>

      <!-- 화면 1 -->
      <div class="stage" id="s1">
        <div class="mount">
          <div class="mveil"></div>
          <div class="mhalo"></div>
          <div class="mask">
            <div class="aper">
              <img id="kv1" alt="">
              <img class="bloom" id="kv2" alt="" aria-hidden="true">
            </div>
            <div class="label"><div class="ttl" id="ttl"></div></div>
            <div class="subin" id="subin"></div>
          </div>
        </div>
        <button class="startbtn" id="start"></button>
      </div>
      <div class="credit" id="credit"></div>
      <div class="tapnote" id="tapnote" style="display:none"></div>

      <!-- 슬라이드 -->
      <div class="halo" id="halo" style="display:none"></div>
      <div class="aperture" id="ap" style="display:none">
        <div class="apin" id="apin"><div class="tk" id="tk"></div><div class="dip" id="dip"></div></div>
        <!-- ⭐ 질감은 개구부 안에 든다 — 합의된 화면 2 목업과 같은 짜임 -->
        <div class="weave">
          <div class="backlit"></div><div class="dust d1"></div><div class="dust d2"></div>
          <div class="glow"></div><div class="vig ivig"></div>
        </div>
      </div>
      <div class="cap" id="cap" style="display:none"></div>

      <!-- 게임 -->
      <div class="gamebox" id="gb">
        <div class="ask" id="ask"></div>
        <div class="disp" id="disp"></div>
        <div class="msg" id="msg"></div>
        <div class="pad" id="pad"></div>
      </div>

      <!-- 판 -->
      <div class="board" id="board">
        <div class="btitle" id="btitle"></div>
        <button class="bclose" id="bclose">닫 기</button>
        <div class="bhint" id="bhint"></div>
        <div class="vp" id="vp"></div>
        <div class="fade"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
        <div class="quote" id="quote"></div>
        <div class="veil" id="veil"></div>
        <div class="pickcard" id="stage"></div>
      </div>

      <!-- 인물 카드 -->
      <div class="card" id="card"></div>
    </div>
  </div>

</div>

<script src="mim_data.js"></script>
<script>
const $ = s => document.querySelector(s);
$('#bed').src = D.바탕;      /* ⚠️`$`를 «정의한 뒤»에 쓴다 — const는 TDZ라 위에서 쓰면 통째로 죽는다 */
const ph=$('#ph'), ap=$('#ap'), apin=$('#apin'), cap=$('#cap'), gb=$('#gb'), halo=$('#halo');
const tk=$('#tk'), dip=$('#dip');

/* 🆕 08-11 밀어내기 — 08-06 목업의 값 그대로. W=개구부 폭 */
const MOVE=1450, GAP=56, W=324;
let busy=false, shown=false;      // shown = 앞 단계에서 개구부가 켜져 있었나
function cell(html){const d=document.createElement('div'); d.innerHTML=html; return d;}
function gapEl(){const d=document.createElement('div'); d.className='blk'; return d;}

/* 개구부에 그림을 넣는다. push=false면 그 자리에서 갈아 끼운다(첫 장·개구부가 꺼졌다 켜질 때) */
function paint(html, push, capText){
  if(!push){
    tk.style.transition='none'; tk.style.transform='translateX(0)';
    tk.innerHTML=''; tk.appendChild(cell(html));
    cap.textContent=capText||''; return;
  }
  /* ⭐ 자막은 밀기가 «끝난 뒤에» 바뀐다 — 08-06 목업 그대로.
     미는 동안 옛 그림에 새 자막이 붙어 있으면 둘이 어긋나 보인다. */
  busy=true; cap.textContent='';
  tk.appendChild(gapEl()); tk.appendChild(cell(html));
  dip.animate([{opacity:0},{opacity:.20,offset:.5},{opacity:0}],{duration:MOVE,easing:'linear'});
  tk.style.transition='transform '+MOVE+'ms linear';
  tk.style.transform='translateX(-'+(W+GAP)+'px)';
  setTimeout(function(){
    tk.style.transition='none';
    while(tk.children.length>1) tk.removeChild(tk.children[0]);
    tk.style.transform='translateX(0)';
    cap.textContent=capText||''; busy=false;
  }, MOVE+20);
}

/* 화면 1 */
$('#credit').textContent = D.문구['화면 1|크레딧'];
$('#start').textContent  = D.문구['화면 1|시작 버튼'];
const A=D.제목.평소;                                  // Man in the Mountain
const cut=A.indexOf(' ');                            // 「Man」 바로 뒤에 끼어든다
$('#kv1').src = $('#kv2').src = D.그림['KV-산'];
$('#subin').textContent = D.부제;
$('#ttl').innerHTML = A.slice(0,cut)
  + '<span class="ins" id="ins">n</span><span class="cur" id="cur"></span>' + A.slice(cut);

const ins=$('#ins'), cur=$('#cur'), ttl=$('#ttl');
function measure(){
  const g=document.createElement('span'); g.textContent='n';
  g.style.cssText='font-family:SE,serif;font-size:17px;letter-spacing:.005em;'+
                  'position:absolute;visibility:hidden;white-space:pre';
  document.body.appendChild(g);
  /* ⭐⭐ **짝수**로 반올림한다 — 가운데 맞춤이라 n이 끼어들면 줄이 «폭의 절반»만큼 밀리는데,
     홀수면 그 절반이 .5px이 되어 `Man` 뒤와 `Mann` 뒤의 커서가 서로 다른 소수 자리에 앉고
     한쪽만 안티에일리어싱으로 번진다. */
  const w=g.getBoundingClientRect().width;
  ins.style.setProperty('--nw', Math.round(w/2)*2+'px'); g.remove();
}
/* 치거나 지운 직후엔 커서가 «켜진 채로» 다시 시작한다 */
function wake(){ cur.style.animation='none'; void cur.offsetWidth; cur.style.animation=''; }
const naptime = ms => new Promise(r=>setTimeout(r,ms));
const BLINK=1060, HOLD=BLINK*2;
let gen=0;
/* ⚠️ 배경 탭은 브라우저가 타이머를 늦춘다 → 다시 보면 언제나 `Man`부터 */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ gen++; ins.classList.remove('on','wet'); wake(); titleLoop(gen); }
});
async function titleLoop(mine){
  ins.classList.remove('on','wet');
  for(;;){
    if(mine!==gen) return;
    await naptime(HOLD);
    if(mine!==gen) return;
    ins.classList.add('on','wet'); wake();          /* 친다 */
    await naptime(320); ins.classList.remove('wet');
    await naptime(HOLD-320);
    if(mine!==gen) return;
    ins.classList.remove('on'); wake();             /* 지운다 — 델 키 */
  }
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ measure(); titleLoop(gen); });

/* 진행표 — 자막 순서 그대로. 4장 끝(쇤펠트 찾기)과 7장 끝(베렌스 찾기)에 게임이 낀다 */
const intro = D.자막.filter(s=>s.화면==='2 도입부');
const ch3   = D.자막.filter(s=>s.화면==='3 원장');
const steps=[];
let last=null;
intro.forEach(s=>{ if(s.장!==last){steps.push({t:'title',장:s.장,제목:s.제목});last=s.장;}
                   steps.push({t:'sub',s}); });
steps.push({t:'game',who:'쇤펠트 부인'});
steps.push({t:'plate'});                                   // 작업판을 펼친다
steps.push({t:'title',장:'7',제목:'원장'});
ch3.forEach(s=>steps.push({t:'sub',s}));
steps.push({t:'game',who:'호프라트 베렌스'});
steps.push({t:'end'});

/* 게임 ①은 4장 마지막 자막 뒤에 와야 한다 — 자리를 옮긴다 */
(function(){ const gi=steps.findIndex(x=>x.t==='game');
  const g=steps.splice(gi,1)[0];
  let at=-1; steps.forEach((x,i)=>{ if(x.t==='sub'&&x.s.장==='4') at=i; });
  steps.splice(at+1,0,g); })();

/* 관계도는 6장(글을 쓸 결심) «앞»에 펼쳐진다 〔08-12 사용자〕 */
(function(){ const pi=steps.findIndex(x=>x.t==='plate');
  const p=steps.splice(pi,1)[0];
  const at=steps.findIndex(x=>x.t==='title'&&x.장==='6');
  steps.splice(at,0,p); })();

let i=-1, timer=null, unlocked=new Set(), got=new Set(), opened=false, afterCard=false;
const state={dict:false, rel:false};

function frame(name){
  const src=D.그림[name]||'';
  return src ? `<img src="${src}" alt=""><img class="bloom" src="${src}" alt="" aria-hidden="true">`
             : `<div class="empty"><b>${name||'그림 없음'}</b><span>그림 자리 — 아직 안 받음</span></div>`;
}

function show(){
  const st=steps[i];
  ['#s1','#credit'].forEach(s=>$(s).style.display = i<0 ? '' : 'none');
  $('#head').style.display = i<0 ? 'none' : 'flex';
  ph.classList.remove('game');
  ap.style.display=halo.style.display=cap.style.display=halo.style.display='none';
  /* #5 자동 넘김을 없앴다 — 탭으로만 넘어간다. 안내는 하단에 〔08-09 사용자〕 */
  const tappable = i>=0 && st && (st.t==='title'||st.t==='sub');
  $('#tapnote').style.display = tappable ? 'block' : 'none';
  $('#tapnote').textContent = D.문구['공통|넘김 안내']||'';
  if(i<0){ shown=false; return; }

  /* 🆕 08-11 — 개구부가 앞 단계에도 켜져 있었을 때만 «민다».
     첫 장이거나 판(plate)이 끼어 개구부가 꺼졌다 켜질 때는 그 자리에서 갈아 끼운다. */
  const push = shown && st.t!=='plate' && st.t!=='game';   /* ㉡ 게임 진입은 밀지 않는다 — 창만 올라간다 〔08-12 사용자〕 */

  if(st.t==='title'){
    /* #4 제목은 **개구부 안**에 든다. 그림 슬라이드와 생김새로 갈린다 */
    ap.style.display=halo.style.display='block';
    paint(`<div class="titleslide"><span class="no">#${st.장}</span><span>${st.제목}</span></div>`, push);
  }
  else if(st.t==='sub'){
    ap.style.display=halo.style.display='block'; cap.style.display=halo.style.display='block';
    paint(frame(st.s.슬롯), push, st.s.자막);
  }
  else if(st.t==='game'){
    ph.classList.add('game');
    ap.style.display=halo.style.display='block'; cap.style.display=halo.style.display='none';
    const bg = st.who==='쇤펠트 부인' ? 'D-홀' : 'F-복도';
    paint(frame(bg), push);
    $('#ask').textContent = D.문구[st.who==='쇤펠트 부인' ? '화면 2|게임 지시문' : '화면 3|게임 지시문'];
    $('#disp').textContent=''; $('#msg').textContent='';
    gb.dataset.who=st.who;
  }
  else if(st.t==='plate'){
    /* §6-2-2 ⛔ 여기서는 미션도 조작 안내도 손 쓰기도 없다. 판이 있다는 것만 알린다 */
    /* ⭐ 소위는 «이때» 채워진다 〔08-12 사용자〕 */
    const o=D.인물.find(x=>D.짧은이름[x.이름]==='해군 소위'); if(o) unlocked.add(o.이름);
    state.rel=true; setHead();
    openBoard('rel', {sample:true});
  }
  else if(st.t==='end'){
    ap.style.display=halo.style.display='block';
    paint('<div class="titleslide"><span style="font-size:17px">여기까지 — 다음은 화면 4</span></div>', push);
  }
  shown = ap.style.display==='block';
}
/* ⚠️ 미는 동안 탭이 들어오면 줄이 어긋난다 — 08-06 목업의 busy 그대로 */
function next(){ if(busy) return; if(i<steps.length-1){ i++; show(); } }
function setHead(){ $('#bDict').disabled=!state.dict; $('#bRel').disabled=!state.rel; }

/* 코드 입력 */
const pad=$('#pad');
'123456789'.split('').forEach(n=>pad.insertAdjacentHTML('beforeend',`<button class="key">${n}</button>`));
pad.insertAdjacentHTML('beforeend','<button class="key fn" data-k="del">지우기</button>');
pad.insertAdjacentHTML('beforeend','<button class="key">0</button>');
pad.insertAdjacentHTML('beforeend','<button class="key fn" data-k="ok">확인</button>');
pad.onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=$('#disp'), k=b.dataset.k;
  /* 🐛 확인까지 「메시지 지우기」를 타면 오답 문구가 뜨자마자 지워진다. 확인은 빼 둔다. */
  if(k==='ok'){ submit(); return; }
  if(k==='del') d.textContent=d.textContent.slice(0,-1);
  else if(d.textContent.length<3) d.textContent+=b.textContent;
  $('#msg').textContent='';
};
function submit(){
  const who=gb.dataset.who, p=D.인물.find(x=>x.이름===who);
  if($('#disp').textContent!==p.코드){
    $('#msg').textContent=D.문구['공통|오답']; $('#disp').textContent=''; return;
  }
  unlocked.add(who);
  /* ⛔ 08-09의 「쇤펠트와 소위를 함께 채운다」는 폐기됐다 〔08-12 사용자〕.
        소위는 아래 plate(관계도)에서 채워진다 — 되살리지 말 것. */
  state.dict=true; setHead(); openCard(p);
}
function openCard(p, again){
  /* 카드는 «천 위»에 뜬다 — 슬라이드도 키패드도 물러난다 〔08-12 사용자〕 */
  ph.classList.remove('game');
  ap.style.display=halo.style.display=cap.style.display='none';
  shown=false;                    /* 개구부가 꺼졌으니 다음 장은 밀지 않고 갈아 끼운다 */
  $('#card').className='card on';
  $('#card').innerHTML=`<img src="${p.초상}" alt=""><div class="nm">${p.이름}</div>
    <div class="job">${p.직업신분}</div><div class="cap2">${p.소개}</div>
    <button class="ok" id="cok">확 인</button>`;
  if(again){ $('#cok').onclick=()=>{ $('#card').className='card'; }; return; }
  /* #9 확인을 누르면 **먼저 인물사전으로 가서** 채워진 것을 본다(§6-3 ③).
     닫으면 그때 다음으로 넘어간다. 〔08-09 사용자〕 */
  $('#cok').onclick=()=>{ $('#card').className='card'; afterCard=true; openBoard('dict'); };
}

/* 판 */
function openBoard(kind, opt){
  opt=opt||{};
  opened=true; $('#board').className='board on'; $('#board').dataset.kind=kind;
  $('#btitle').textContent = D.문구[kind==='rel' ? '공통|판 제목 — 관계도' : '공통|판 제목 — 인물사전'];
  /* §6-2-2 ⛔ 「작업판을 펼친다」에서는 조작을 안내하지 않는다 */
  $('#bhint').textContent = (kind==='rel' && !opt.sample) ? D.문구['관계 원형|조작 안내'] : '';
  const vp=$('#vp'); closeQuote();
  const full=s=>Object.keys(D.짧은이름).find(f=>D.짧은이름[f]===s);

  if(kind==='dict'){
    /* 인물 격자 v3 — 3열 · 미수집은 흐림+대비·밝기·투명도 · 수집은 테두리 한 겹 */
    vp.innerHTML='<div class="grid">'+D.인물.map((p,k)=>{
      const g=unlocked.has(p.이름);
      return `<button class="cell ${g?'got':'faint'}" data-i="${k}" ${g?'':'disabled'}>
        <div class="inner"><img src="${p.초상}" alt=""></div>
        <div class="gnm">${g?D.짧은이름[p.이름]:''}</div></button>`;}).join('')+'</div>';
    /* 두 박자 — ①떠올라 가운데로 ②뒤집힌다 */
    vp.querySelectorAll('.cell').forEach(c=>{ if(c.disabled) return;
      c.onclick=()=>pickUp(D.인물[+c.dataset.i]); });
    return;
  }

  /* ── 관계 원형 v8 — 값은 `_build_screen2-1_circle.py` 그대로 ── */
  const BW=520, BH=850, CX=260, CY=315, R=220, WW=96, WH=128, GAP=8, OFF=16;
  const pos={}; D.둘레.forEach((sh,k)=>{ const a=-Math.PI/2 + k*Math.PI*2/D.둘레.length;
    pos[sh]={x:CX+R*Math.cos(a), y:CY+R*Math.sin(a)}; });
  pos[D.가운데]={x:CX, y:CY};

  const rel=D.벽문장.filter(w=>w.종류==='관계' && pos[w.화자] && pos[w.대상]);
  /* 「그 밖의 관계」 — 코드로 찾는 게 아니라 저절로 채워진다. 본 판과 «같은 배선»을 탄다 */
  const relX=D.벽문장.filter(w=>w.종류==='그 밖의 관계');
  const relAll=rel.concat(relX);
  const has=(a,b)=>rel.some(w=>w.화자===a && w.대상===b);
  let sv='', hits='';
  rel.forEach((w,idx)=>{
    const A=pos[w.화자], B=pos[w.대상];
    let dx=B.x-A.x, dy=B.y-A.y; const L=Math.hypot(dx,dy); dx/=L; dy/=L;
    let ox=0, oy=0;
    if(has(w.대상,w.화자)){
      /* 🐛 법선은 **쌍의 고정 방향**(이름 순)에서 뽑는다 — 화살표 방향에서 뽑으면
         쌍방일 때 부호가 뒤집혀 상쇄되고 두 줄이 겹친다(08-07 버그) */
      const first = w.화자 < w.대상 ? w.화자 : w.대상;
      const P=pos[first], Q=pos[first===w.화자?w.대상:w.화자];
      let ux=Q.x-P.x, uy=Q.y-P.y; const M=Math.hypot(ux,uy); ux/=M; uy/=M;
      const k=(w.화자===first?OFF:-OFF); ox=-uy*k; oy=ux*k;
    }
    const t = Math.min((WW/2+GAP)/Math.abs(dx||1e-6), (WH/2+GAP)/Math.abs(dy||1e-6));
    const x1=A.x+ox+dx*t, y1=A.y+oy+dy*t, x2=B.x+ox-dx*t, y2=B.y+oy-dy*t;
    const done=got.has(w.항목);
    sv+=`<line class="arw ${done?'done':'todo'}" data-i="${idx}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if(done) sv+=`<polygon class="ahead" data-i="${idx}" points="${x2},${y2} ${x2-dx*9+dy*4.2},${y2-dy*9-dx*4.2} ${x2-dx*9-dy*4.2},${y2-dy*9+dx*4.2}"/>`;
    hits+=`<line class="hit off" data-i="${idx}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  });

  const face=(nm,style,cls)=>{ const p=D.인물.find(q=>q.이름===nm), g=unlocked.has(nm);
    return `<div class="face ${g?'':'faint'} ${cls||''}" data-nm="${D.짧은이름[nm]}" style="${style}">
      <div class="win"><img src="${p.초상}" alt=""></div>
      <div class="nm">${g?D.짧은이름[nm]:''}</div></div>`; };

  let h=`<div class="plate"><svg class="wires" viewBox="0 0 ${BW} ${BH}">${sv}${hits}</svg>`;
  Object.keys(pos).forEach(sh=>h+=face(full(sh), `left:${pos[sh].x}px;top:${pos[sh].y}px`));
  /* ⭐⭐⭐ 「그 밖의 관계」 틀 — 화살표 «둘»이 서로를 가리킨다. ⛔화살표 위 글자는 없다 */
  const gx=relX.map((w,k)=>{
    const i2=rel.length+k, toL=(w.대상==='해군 소위');   /* 소위가 왼쪽·쇤펠트가 오른쪽 */
    const y=toL?33:11, x1=toL?144:6, x2=toL?18:132, hx=toL?8:142;
    return `<line class="arw done" data-i="${i2}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>
      <polygon class="ahead" data-i="${i2}" points="${hx},${y} ${x2},${y-4.5} ${x2},${y+4.5}"/>
      <line class="hit off" data-i="${i2}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
  }).join('');
  h+=`<div class="grp"><span class="tag">그 밖의 관계</span>
        ${face(full('해군 소위'),'','l')}${face(full('쇤펠트 부인'),'','r')}
        <svg viewBox="0 0 150 44">${gx}</svg>
      </div></div>`;
  vp.innerHTML=h;
  wireEdges(vp, relAll);
  requestAnimationFrame(()=>{ vp.scrollLeft=(vp.scrollWidth-vp.clientWidth)/2;
    vp.scrollTop=0; });
}

/* 두 박자 — 격자에서 카드를 집어 올려 뒤집는다 (인물 격자 v3) */
function pickUp(p){
  const st=$('#stage');
  st.innerHTML=`<div class="sface"><img src="${p.초상}" alt=""></div>
    <div class="sface sback"><div class="nm2">${p.이름}</div>
      <div class="job2">${p.직업신분}</div><div class="cap3">${p.소개}</div></div>`;
  $('#veil').className='veil on'; st.className='pickcard up';
  setTimeout(()=>st.classList.add('flip'), 260);
  $('#veil').onclick=()=>{ st.className='pickcard'; $('#veil').className='veil'; };
  st.onclick=()=>{ st.className='pickcard'; $('#veil').className='veil'; };
}
/* 판을 닫으면 «헤드 버튼»이 한 번 반짝인다 — 자리와 쓸모를 알아채는 정도로만.
   ⛔ 판 전체를 번쩍이지 않는다. ⭐ 판마다 «처음 닫을 때» 딱 한 번뿐이다. 〔08-12 사용자〕 */
const blinked={};
$('#bclose').onclick=()=>{
  const b=$('#board'), kind=b.dataset.kind;
  b.className='board';
  if(!blinked[kind]){ blinked[kind]=1;
    const btn=$(kind==='rel' ? '#bRel' : '#bDict');
    btn.classList.add('blink');
    setTimeout(()=>btn.classList.remove('blink'), 780);
  }
  if(afterCard){ afterCard=false; next(); return; }
  if(steps[i]&&steps[i].t==='plate') next();
};
$('#bDict').onclick=()=>openBoard('dict');
$('#bRel').onclick =()=>openBoard('rel');


/* ── 선 짚기 — 두 박자 (§6-2-2-1 ④) ────────────────────────
   ① 인물을 누르면 그가 남을 두고 한 말만 살아난다(96×128이라 표적이 넉넉하다).
   ② 살아난 선을 누르면 그 구절 하나가 뜬다. 반짝임은 그때 멈춘다 —
      「여기를 눌러라」는 말이라 누른 뒤엔 할 일이 없다. */
function wireEdges(sc, rel){
  /* ⭐ svg가 둘이다 — 원형 판과 「그 밖의 관계」 틀. 둘을 «같이» 집어야
        그쪽 화살표도 두근거리고 눌린다 〔08-12 사용자 지적〕 */
  const all=[...sc.querySelectorAll('.arw[data-i],.ahead[data-i]')];
  const hits=[...sc.querySelectorAll('.hit[data-i]')];
  let picked=null;
  const paint=()=>{
    all.forEach(el=>{ const w=rel[+el.dataset.i];
      const live = picked && w.화자===picked;
      el.classList.toggle('dim', !!picked && !live);
      el.classList.toggle('live', !!live && !$('#quote').classList.contains('on'));
    });
    hits.forEach(el=>{ const w=rel[+el.dataset.i];
      el.classList.toggle('off', !(picked && w.화자===picked)); });
    sc.querySelectorAll('.face').forEach(c=>{
      c.classList.toggle('dim', !!picked && c.dataset.nm!==picked);
      c.classList.toggle('on',  !!picked && c.dataset.nm===picked); });
  };
  sc.querySelectorAll('.face').forEach(c=>{ if(c.classList.contains('faint')) return;
    c.onclick=()=>{ closeQuote(); picked=(picked===c.dataset.nm)?null:c.dataset.nm; paint(); }; });
  hits.forEach(el=>el.onclick=()=>{ openQuote(rel[+el.dataset.i]); paint(); });
  paint();
}
function openQuote(w){
  const q=$('#quote'); q.className='quote on';
  q.innerHTML=`<button class="x" id="qx">×</button>
    <div class="who">${w.화자} → ${w.대상}</div><div class="txt">${w.문장}</div>`;
  $('#qx').onclick=closeQuote;
}
function closeQuote(){ $('#quote').className='quote'; }

/* 넘기기 */
ph.onclick=e=>{
  if(e.target.closest('.gamebox,.card,.board,.head,.startbtn')) return;
  const st=steps[i];
  if(i>=0 && st && (st.t==='title'||st.t==='sub')) next();
};
/* ── 오프닝 — 환등기를 맞춘다 〔08-12 사용자〕 ─────────────────
   빈 빛으로 켜고, 자리·기울기·밝기·크기·초점이 흔들리다 제자리에 선다.
   ⭐ 다 서고 «나서» 첫 슬라이드가 든다. 흔들리는 동안 그림은 없다. */
const OPEN_MS=9200;   /* 훨씬 천천히 〔08-12 사용자〕 */
const OPEN_KF=[
 {offset:0,   transform:'translate(-38px,30px) rotate(-3.4deg) scale(1.30)', filter:'blur(8px) brightness(.38)'},
 {offset:.16, transform:'translate(26px,-18px) rotate(2.6deg) scale(.72)',   filter:'blur(6.4px) brightness(2.05)'},
 {offset:.34, transform:'translate(-17px,14px) rotate(-1.7deg) scale(1.17)', filter:'blur(4.2px) brightness(.58)'},
 {offset:.54, transform:'translate(10px,-8px) rotate(1.1deg) scale(.90)',    filter:'blur(2.6px) brightness(1.52)'},
 {offset:.72, transform:'translate(-5px,4px) rotate(-.5deg) scale(1.06)',    filter:'blur(1.4px) brightness(.82)'},
 {offset:.88, transform:'translate(2px,-1.5px) rotate(.18deg) scale(.985)',  filter:'blur(.5px) brightness(1.10)'},
 {offset:1,   transform:'none', filter:'none'}
];
function opening(){
  ap.style.display=halo.style.display='block'; cap.style.display='none';
  tk.style.transition='none'; tk.style.transform='translateX(0)';
  tk.innerHTML=''; tk.appendChild(cell(''));          /* 빈 빛 — 그림이 없다 */
  const o={duration:OPEN_MS, easing:'cubic-bezier(.32,0,.22,1)', fill:'forwards'};
  halo.animate(OPEN_KF.map(k=>({offset:k.offset, transform:k.transform})), o);
  return ap.animate(OPEN_KF, o).finished.then(()=>{
    ap.getAnimations().forEach(x=>x.cancel());
    halo.getAnimations().forEach(x=>x.cancel());
  });
}
$('#start').onclick=()=>{
  $('#start').disabled=true;
  ['#s1','#credit'].forEach(s=>$(s).style.display='none');
  opening().then(()=>{ i=0; show(); });
};
/* 360×760 판을 화면에 맞춰 통째로 키운다 — 합의된 픽셀 값은 그대로 둔다 */
function fit(){ ph.style.transform='scale('+Math.min(innerWidth/360, innerHeight/760)+')'; }
addEventListener('resize',fit); fit();
show();
</script>
